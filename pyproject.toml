[project]
name = "agentis-slack"
version = "0.1.0"
description = ""
authors = [
    {name = "Ondrej Novak",email = "novakondrej@seznam.cz"}
]
requires-python = ">=3.13"
dependencies = [
    "slack-bolt>=1.27.0",
    "requests (>=2.34.2,<3.0.0)",
    "markdown-to-mrkdwn (>=0.3.3,<0.4.0)",
    "mcp (>=1.9.0)",
    "psutil (>=5.9)",
]

[project.scripts]
agentis-slack = "agentis_slack.main:main"
agentis-slack-mcp = "agentis_slack.question_mcp:main"

[tool.pytest.ini_options]
pythonpath = ["src"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
